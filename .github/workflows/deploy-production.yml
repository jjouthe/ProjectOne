name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FRONTEND: silentintellect-frontend
  ECR_REPOSITORY_BACKEND: silentintellect-backend

jobs:
  # Pre-deployment checks
  pre-deployment:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    environment: production
    
    outputs:
      deploy-environment: ${{ steps.set-env.outputs.environment }}
      image-tag: ${{ steps.set-tag.outputs.tag }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set environment
      id: set-env
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        else
          echo "environment=production" >> $GITHUB_OUTPUT
        fi

    - name: Set image tag
      id: set-tag
      run: |
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Verify deployment readiness
      run: |
        echo "🔍 Verifying deployment readiness..."
        echo "Environment: ${{ steps.set-env.outputs.environment }}"
        echo "Image tag: ${{ steps.set-tag.outputs.tag }}"
        echo "Ref: ${{ github.ref }}"
        echo "Event: ${{ github.event_name }}"

  # Infrastructure deployment
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: pre-deployment
    environment: ${{ needs.pre-deployment.outputs.deploy-environment }}
    
    outputs:
      alb-dns: ${{ steps.terraform-output.outputs.alb_dns_name }}
      rds-endpoint: ${{ steps.terraform-output.outputs.rds_endpoint }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0
        terraform_wrapper: false

    - name: Terraform Init
      working-directory: ./infrastructure
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=silentintellect/${{ needs.pre-deployment.outputs.deploy-environment }}/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Plan
      working-directory: ./infrastructure
      run: |
        terraform plan \
          -var="environment=${{ needs.pre-deployment.outputs.deploy-environment }}" \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="frontend_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ needs.pre-deployment.outputs.image-tag }}" \
          -var="backend_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_BACKEND }}:${{ needs.pre-deployment.outputs.image-tag }}" \
          -out=tfplan

    - name: Terraform Apply
      working-directory: ./infrastructure
      run: terraform apply -auto-approve tfplan

    - name: Get Terraform Outputs
      id: terraform-output
      working-directory: ./infrastructure
      run: |
        echo "alb_dns_name=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT
        echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT

  # Deploy smart contracts
  deploy-contracts:
    name: Deploy Smart Contracts
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-infrastructure]
    environment: ${{ needs.pre-deployment.outputs.deploy-environment }}
    
    outputs:
      contract-addresses: ${{ steps.deploy-contracts.outputs.addresses }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: contracts/package-lock.json

    - name: Install dependencies
      working-directory: ./contracts
      run: npm ci

    - name: Compile contracts
      working-directory: ./contracts
      run: npm run compile

    - name: Deploy contracts
      id: deploy-contracts
      working-directory: ./contracts
      run: |
        if [[ "${{ needs.pre-deployment.outputs.deploy-environment }}" == "production" ]]; then
          npm run deploy:mainnet
        else
          npm run deploy:testnet
        fi
        
        # Extract contract addresses from deployment output
        # This would need to be implemented based on your deployment script output
        echo "addresses={}" >> $GITHUB_OUTPUT
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        MAINNET_URL: ${{ secrets.MAINNET_RPC_URL }}
        GOERLI_URL: ${{ secrets.GOERLI_RPC_URL }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Verify contracts
      working-directory: ./contracts
      run: |
        # Contract verification would happen here
        echo "Contract verification completed"
      env:
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

  # Build and push Docker images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: pre-deployment
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./Dockerfile.frontend
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ needs.pre-deployment.outputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_API_URL=https://${{ needs.deploy-infrastructure.outputs.alb-dns }}/api
          NEXT_PUBLIC_APP_ENV=${{ needs.pre-deployment.outputs.deploy-environment }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./Dockerfile.backend
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ needs.pre-deployment.outputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy applications to ECS
  deploy-applications:
    name: Deploy Applications
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-infrastructure, deploy-contracts, build-and-push]
    environment: ${{ needs.pre-deployment.outputs.deploy-environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update ECS service - Frontend
      run: |
        aws ecs update-service \
          --cluster silentintellect-${{ needs.pre-deployment.outputs.deploy-environment }} \
          --service silentintellect-frontend-service \
          --force-new-deployment

    - name: Update ECS service - Backend
      run: |
        aws ecs update-service \
          --cluster silentintellect-${{ needs.pre-deployment.outputs.deploy-environment }} \
          --service silentintellect-backend-service \
          --force-new-deployment

    - name: Wait for deployment to complete
      run: |
        echo "⏳ Waiting for ECS services to stabilize..."
        
        aws ecs wait services-stable \
          --cluster silentintellect-${{ needs.pre-deployment.outputs.deploy-environment }} \
          --services silentintellect-frontend-service
        
        aws ecs wait services-stable \
          --cluster silentintellect-${{ needs.pre-deployment.outputs.deploy-environment }} \
          --services silentintellect-backend-service
        
        echo "✅ ECS services are stable"

  # Run database migrations
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-infrastructure, deploy-applications]
    environment: ${{ needs.pre-deployment.outputs.deploy-environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run database migrations
      working-directory: ./backend
      run: npm run migrate
      env:
        DATABASE_URL: postgresql://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@${{ needs.deploy-infrastructure.outputs.rds-endpoint }}:5432/silentintellect

  # Post-deployment tests
  post-deployment-tests:
    name: Post-deployment Tests
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-infrastructure, deploy-applications, run-migrations]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Health check - Frontend
      run: |
        echo "🏥 Checking frontend health..."
        curl -f https://${{ needs.deploy-infrastructure.outputs.alb-dns }} || exit 1
        echo "✅ Frontend is healthy"

    - name: Health check - Backend
      run: |
        echo "🏥 Checking backend health..."
        curl -f https://${{ needs.deploy-infrastructure.outputs.alb-dns }}/api/health || exit 1
        echo "✅ Backend is healthy"

    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests..."
        # Add smoke test commands here
        echo "✅ Smoke tests passed"

  # Notify deployment status
  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-infrastructure, deploy-contracts, deploy-applications, post-deployment-tests]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.post-deployment-tests.result == 'success' }}
      run: |
        echo "🎉 Deployment to ${{ needs.pre-deployment.outputs.deploy-environment }} completed successfully!"
        echo "🌐 Application URL: https://${{ needs.deploy-infrastructure.outputs.alb-dns }}"
        echo "📦 Image tag: ${{ needs.pre-deployment.outputs.image-tag }}"

    - name: Notify failure
      if: ${{ needs.post-deployment-tests.result == 'failure' || needs.deploy-applications.result == 'failure' }}
      run: |
        echo "❌ Deployment to ${{ needs.pre-deployment.outputs.deploy-environment }} failed!"
        echo "Please check the logs and take appropriate action."
        exit 1

    # Optional: Send notifications to Slack, Discord, etc.
    # - name: Send Slack notification
    #   uses: 8398a7/action-slack@v3
    #   with:
    #     status: ${{ job.status }}
    #     channel: '#deployments'
    #     webhook_url: ${{ secrets.SLACK_WEBHOOK }}
    #   if: always()

